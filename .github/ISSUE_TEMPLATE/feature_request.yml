name: Feature request
description: Propose a capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what blocks you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: parity
    attributes:
      label: Clone-parity impact
      description: >
        Does this affect `replica/features.csv` (clone column), `PRD.md` or `TASKS.md`?
        Name the row or task ID. Deferred features stay `no`/`skip` — no invented parity.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / tests expected
  - type: textarea
    id: docs
    attributes:
      label: Docs that would need updating
      description: "e.g. API.md, DATABASE.md, SECURITY.md, CHANGELOG.md, .env.example"
  - type: checkboxes
    id: confirm
    attributes:
      options:
        - label: "I included no real secrets, tokens, passphrases or ciphertext."
          required: true
