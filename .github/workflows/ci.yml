name: CI

on:
  push:
  pull_request:
  # CI has been registered on main since 2026-11-11; use its mature schedule to
  # guarantee a liveness check even if the newer ops workflow's cron is dropped.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    if: github.event_name != 'schedule'
    name: Dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1 branch head
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Ruby dependency audit
        run: bundle exec bundler-audit check --update
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Frontend dependency audit (high and above fails)
        run: npm --prefix frontend ci --no-audit --no-fund && npm --prefix frontend audit --audit-level=high
      - name: Install the pinned rebrand gate tool
        run: |
          # AGENTS.md names this MIT repo as the canonical source. Pin the SHA so
          # CI runs the exact sweep verified locally (sha256 e70165b7...).
          git clone --quiet https://github.com/Jakeschincariol/replica-skill.git /tmp/replica-skill
          git -C /tmp/replica-skill checkout --quiet 77c9436fb3d18c3d58169efb8caf4fe906b0dc51
          mkdir -p "$HOME/.agents/skills"
          cp -R /tmp/replica-skill/replica-brand "$HOME/.agents/skills/"
      - name: Rebrand gate
        run: script/brand-sweep.sh

  backend:
    if: github.event_name != 'schedule'
    name: Backend specs
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      REDIS_URL: redis://127.0.0.1:6379/15
      RACK_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1 branch head
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # hardening_spec exercises statically served SPA assets; build them here
      # instead of skipping that assertion when the jobs run in parallel.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: bundle exec rspec

  frontend:
    if: github.event_name != 'schedule'
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build

  container:
    if: github.event_name != 'schedule'
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [security, backend, frontend]
    # Compose interpolates these on every invocation, including `down`, so they
    # must be present for the whole job — not just the `up` steps.
    env:
      SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      REDIS_PASSWORD: ci-only-redis-password-0123456789
      APP_PORT: "3000"
      AUTH_MODE: simple
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - run: docker build -t oneshotlink-web .
      - name: Boot compose stack and run a lifecycle smoke test
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "200"
          key=$(curl -fsS -X POST http://127.0.0.1:3000/api/v3/guest/conceal \
            -H 'content-type: application/json' \
            -d '{"secret":"ci-smoke","ttl":1800}' | jq -r .secret_key)
          test -n "$key"
          # GET is a non-consuming preview since K-35; only POST /reveal spends the secret.
          test "$(curl -fsS http://127.0.0.1:3000/api/v3/guest/secret/$key | jq -r '.secret_value // empty')" = ""
          test "$(curl -fsS -X POST http://127.0.0.1:3000/api/v3/guest/secret/$key/reveal \
            -H 'content-type: application/json' -d '{}' | jq -r .secret_value)" = "ci-smoke"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:3000/api/v3/guest/secret/$key/reveal \
            -H 'content-type: application/json' -d '{}')" = "404"
          npm --prefix e2e ci --no-audit --no-fund
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e test
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e run test:accounts
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e run test:file
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e run test:requests
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e run test:webhooks
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e run test:states
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e run test:mobile
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e run test:mobile
          # WCAG 2.2 AA gate: axe runs in the same browser against static routes
          # and the live reveal phases. A violation fails the build (D-016).
          BASE_URL=http://127.0.0.1:3000 CHROME_PATH=/usr/bin/google-chrome npm --prefix e2e run test:a11y
          docker compose down -v
      - name: SDK examples — run every quickstart against a throwaway stack
        env:
          OTS_APP_IMAGE: oneshotlink-web
        run: bash script/test-examples.sh
      - name: Load test — single-use invariant under concurrency
        env:
          RATE_LIMIT_CONCEAL: "100000"
          RATE_LIMIT_REVEAL: "100000"
        run: |
          # Restart the stack with the rate limits raised so we exercise the
          # atomic reveal path rather than the limiter.
          docker compose down -v
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 2
          done
          docker run --rm --network=host -v "$PWD":/app -w /app \
            -e BASE_URL=http://127.0.0.1:3000 \
            ruby:3.3-slim ruby script/loadtest.rb 100 20
          docker compose down -v
      # Proves the go-live gate still passes on a good config and still fails
      # on each bad one, so it cannot rot into an always-green check.
      - name: Preflight gate self-test
        run: script/preflight_selftest.sh
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs

  # CI has been active on main since 2026-11-11. This job closes the K-46
  # liveness gap: it detects a missing/stale webhook worker run and dispatches
  # one, so correctness no longer depends solely on the newer workflow's cron.
  worker-liveness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Webhook worker liveness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Check last successful worker run and dispatch if stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create webhook-liveness --description "Scheduled webhook worker is stale" --color b60205 >/dev/null 2>&1 || true
          LAST=$(gh api "repos/$GH_REPO/actions/workflows/ops-free-tier.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // ""')
          if [ -z "$LAST" ]; then
            echo "no successful ops run found; dispatching worker"
            gh workflow run ops-free-tier.yml -f task=webhooks
            exit 0
          fi
          EPOCH=$(date -u -d "$LAST" +%s)
          NOW=$(date -u +%s)
          AGE=$(( (NOW - EPOCH) / 60 ))
          echo "last successful ops run: $LAST (${AGE}m ago)"
          if [ "$AGE" -gt 75 ]; then
            echo "worker stale; dispatching and alerting"
            gh workflow run ops-free-tier.yml -f task=webhooks
            OPEN=$(gh issue list --label webhook-liveness --state open --json number --jq length)
            if [ "$OPEN" = "0" ]; then
              gh issue create --label webhook-liveness \
                --title "Webhook worker stale (${AGE}m since last success)" \
                --body "The scheduled worker has not completed successfully in ${AGE} minutes. A replacement was dispatched automatically. Check ops-free-tier workflow runs and the webhook queue depth."
            fi
          else
            echo "worker healthy; no action"
          fi
