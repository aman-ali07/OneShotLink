name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend specs
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      REDIS_URL: redis://127.0.0.1:6379/15
      RACK_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rspec

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker build -t onetime-secret-web .
      - name: Boot compose stack and run a lifecycle smoke test
        env:
          SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          APP_PORT: "3000"
          AUTH_MODE: simple
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "200"
          key=$(curl -fsS -X POST http://127.0.0.1:3000/api/v3/guest/conceal \
            -H 'content-type: application/json' \
            -d '{"secret":"ci-smoke","ttl":1800}' | jq -r .secret_key)
          test -n "$key"
          test "$(curl -fsS http://127.0.0.1:3000/api/v3/guest/secret/$key | jq -r .secret_value)" = "ci-smoke"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v3/guest/secret/$key)" = "404"
          npm --prefix e2e ci --no-audit --no-fund
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e test
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e run test:accounts
          docker compose down -v
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs
