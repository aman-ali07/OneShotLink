name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Ruby dependency audit
        run: bundle exec bundler-audit check --update
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend dependency audit (high and above fails)
        run: npm --prefix frontend ci --no-audit --no-fund && npm --prefix frontend audit --audit-level=high

  backend:
    name: Backend specs
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      REDIS_URL: redis://127.0.0.1:6379/15
      RACK_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rspec

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [security, backend, frontend]
    # Compose interpolates these on every invocation, including `down`, so they
    # must be present for the whole job — not just the `up` steps.
    env:
      SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      REDIS_PASSWORD: ci-only-redis-password-0123456789
      APP_PORT: "3000"
      AUTH_MODE: simple
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker build -t oneshotlink-web .
      - name: Boot compose stack and run a lifecycle smoke test
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "200"
          key=$(curl -fsS -X POST http://127.0.0.1:3000/api/v3/guest/conceal \
            -H 'content-type: application/json' \
            -d '{"secret":"ci-smoke","ttl":1800}' | jq -r .secret_key)
          test -n "$key"
          test "$(curl -fsS http://127.0.0.1:3000/api/v3/guest/secret/$key | jq -r .secret_value)" = "ci-smoke"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v3/guest/secret/$key)" = "404"
          npm --prefix e2e ci --no-audit --no-fund
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e test
          BASE_URL=http://127.0.0.1:3000 npm --prefix e2e run test:accounts
          docker compose down -v
      - name: Load test — single-use invariant under concurrency
        env:
          RATE_LIMIT_CONCEAL: "100000"
          RATE_LIMIT_REVEAL: "100000"
        run: |
          # Restart the stack with the rate limits raised so we exercise the
          # atomic reveal path rather than the limiter.
          docker compose down -v
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 2
          done
          docker run --rm --network=host -v "$PWD":/app -w /app \
            -e BASE_URL=http://127.0.0.1:3000 \
            ruby:3.3-slim ruby script/loadtest.rb 100 20
          docker compose down -v
      # Proves the go-live gate still passes on a good config and still fails
      # on each bad one, so it cannot rot into an always-green check.
      - name: Preflight gate self-test
        run: script/preflight_selftest.sh
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs
