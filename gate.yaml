# Machine-readable twin of this repository's safety rules (SECURITY.md,
# PRODUCTION_READINESS.md, docs/DECISIONS.md). Read by tools/loop-gate and by the
# loop skills before a run touches anything. Keep in sync with SECURITY.md.
version: 1

# Never touched by a loop without an explicit human "yes" in that run's log.
denylist:
  - "**/.env"
  - "**/.env.*"
  - "**/secrets/**"
  - "**/credentials/**"
  - "**/*.pem"
  - "**/*.key"
  - "**/*_secret*"
  # Crypto, password hashing and sessions: a silent edit here is a breach class
  # bug, not a refactor (D-012 explains why the passphrase is not a second key).
  - "lib/onetime/crypto.rb"
  - "lib/onetime/password.rb"
  - "lib/onetime/models/session.rb"
  - "lib/onetime/web/app.rb"
  # Deployment and infrastructure contracts.
  - "compose.yaml"
  - "Dockerfile"
  - "config.ru"
  - "config/puma.rb"
  - ".github/workflows/**"
  - "script/preflight.sh"
  - "script/preflight_selftest.sh"
  # This gate file and the loop's own contract.
  - "gate.yaml"
  - "loop-constraints.md"

# Escalate instead of acting when a change is broad.
maxFiles: 10

# Only these paths may be proposed for auto-merge, and only at L2+ after the
# verifier has been right for a week (docs/loop-engineering docs/safety.md).
autoMergeAllowlist:
  - "docs/**"
  - "**/*.md"
  - "replica/**"
  - "site/**"
